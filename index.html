<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="description" content="POS SuperApp — kasir, inventori, pelanggan, laporan, dan asisten bisnis.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
        colors: { ink:'#1E293B', cream:'#FAF9F6', mint:'#A7F3D0', lemon:'#FDE68A', lavender:'#DDD6FE', coral:'#FECACA', sky:'#BFDBFE' },
        boxShadow: { hard:'3px 3px 0 #1E293B', soft:'0 12px 40px rgba(30,41,59,.08)' }
      }}
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--ink:#1E293B;--cream:#FAF9F6;--line:rgba(30,41,59,.13);--muted:#64748b;--mint:#A7F3D0;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-padding-top:84px;scroll-padding-bottom:150px;background:var(--cream)}
    body{font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;min-height:100dvh;width:100%;background:var(--cream);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
    body.modal-open{overflow:hidden}
    #app{min-height:100vh;min-height:100dvh;width:100%}
    .app-shell{min-height:100vh;min-height:100dvh;width:100%;align-items:stretch}
    #app .app-main{width:100%;max-width:1600px;min-width:0;min-height:calc(100dvh - 66px);margin:0 auto;padding:22px 24px 36px}
    @media(max-width:767px){#app .app-main{min-height:calc(100dvh - 64px);padding:18px 14px calc(178px + var(--safe-bottom));}}
    @media(min-width:768px){#app .app-main{padding:24px 28px 40px}}
    button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.48}
    input,select,textarea{max-width:100%;min-width:0}
    .bento{background:#fff;border:1.5px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);min-width:0}
    .bento-soft{background:#fff;border:1px solid var(--line);border-radius:16px;min-width:0}
    .btn{border:1.5px solid var(--ink);border-radius:13px;padding:.68rem .92rem;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:.48rem;transition:transform .12s,box-shadow .12s;box-shadow:2px 2px 0 var(--ink);background:#fff;min-height:42px;white-space:nowrap}
    .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}.btn-primary{background:#A7F3D0}.btn-dark{background:var(--ink);color:#fff}.btn-danger{background:#FECACA}.btn-ghost{box-shadow:none;border-color:transparent;background:transparent}
    .field{width:100%;border:1.5px solid #cbd5e1;border-radius:12px;padding:.74rem .82rem;background:#fff;outline:none;min-width:0;min-height:44px;color:var(--ink)}
    .field:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(191,219,254,.8)}
    .label{display:block;font-size:.72rem;font-weight:800;color:#64748b;margin:0 0 .38rem;letter-spacing:.04em;text-transform:uppercase}
    .nav-item{width:100%;display:flex;align-items:center;gap:.7rem;text-align:left;border-radius:12px;padding:.72rem .82rem;color:#64748b;font-size:.86rem;font-weight:700}
    .nav-item.active,.nav-item:hover{background:#FDE68A;color:var(--ink)}
    .pill{border-radius:999px;padding:.28rem .65rem;font-size:.72rem;font-weight:800;white-space:nowrap}
    .kpi{background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:1rem;box-shadow:3px 3px 0 var(--ink);min-width:0;overflow:hidden}
    .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
    .product-card{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:.9rem;text-align:left;min-width:0;box-shadow:2px 2px 0 var(--ink);transition:transform .12s}
    .product-card:active{transform:translate(2px,2px);box-shadow:none}
    .product-tile{height:45px;width:45px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;flex:none}
    .scrollbar-none{scrollbar-width:none}.scrollbar-none::-webkit-scrollbar{display:none}
    .bottom-dock{height:calc(84px + var(--safe-bottom));padding:8px 12px calc(8px + var(--safe-bottom));box-shadow:0 -8px 24px rgba(15,23,42,.07);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
    .bottom-dock button{min-width:0;min-height:58px;padding:6px 2px;touch-action:manipulation;border-radius:14px;justify-content:center;line-height:1.1}
    .bottom-dock button:disabled{opacity:.3}
    .pos-cart-bar{bottom:calc(88px + var(--safe-bottom))}
    .modal-backdrop{position:fixed;inset:0;min-height:100vh;min-height:100dvh;background:rgba(15,23,42,.48);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:10px 0 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .modal-sheet{background:#fff;border:1.5px solid var(--ink);border-radius:22px 22px 0 0;width:100%;max-height:calc(100dvh - 10px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 16px calc(20px + var(--safe-bottom));box-shadow:0 -8px 40px rgba(15,23,42,.16)}
    .modal-sheet input,.modal-sheet select,.modal-sheet textarea{font-size:16px}
    @media(min-width:768px){.modal-backdrop{align-items:center;padding:18px}.modal-sheet{max-width:640px;border-radius:22px;max-height:calc(90dvh - 24px);padding:22px}.modal-sheet.md\:max-w-2xl{max-width:760px}}
    .table-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 150px;align-items:center;gap:.75rem;padding:.9rem 1rem;border-bottom:1px solid #e8edf2;min-width:0}
    .table-row:last-child{border-bottom:0}
    @media(max-width:767px){.table-row{grid-template-columns:minmax(0,1fr) auto;gap:.28rem .6rem;padding:.85rem}.table-row .desk-col{display:none}.table-row .mobile-sub{display:block}.table-row .row-amount{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;min-width:0}}
    .mobile-sub{display:none}
    .products-heading-actions{display:flex;gap:9px;flex-wrap:wrap}
    .product-admin-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
    .product-admin-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:15px;min-width:0;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,box-shadow .15s}
    .product-admin-card:hover{border-color:#94a3b8;box-shadow:0 6px 18px rgba(15,23,42,.05)}
    .product-admin-head{display:flex;align-items:flex-start;gap:10px;min-width:0}
    .product-admin-name{font-weight:800;font-size:.94rem;line-height:1.35;overflow-wrap:anywhere}
    .product-admin-meta{font-size:.72rem;color:#94a3b8;margin-top:4px;overflow-wrap:anywhere}
    .product-admin-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;border-top:1px solid #eef2f7;padding-top:11px}
    .product-admin-foot .metric-label{font-size:.62rem;letter-spacing:.04em;color:#94a3b8;font-weight:800;text-transform:uppercase}
    .product-admin-foot .metric-value{font-size:.88rem;font-weight:800;margin-top:3px;overflow-wrap:anywhere}
    @media(min-width:640px){.product-admin-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}}
    @media(min-width:1200px){.product-admin-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
    @media(max-width:380px){.product-admin-foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px;gap:6px}.product-admin-foot .metric-value{font-size:.8rem}.product-admin-card{padding:12px}}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;min-width:0}
    .page-heading h1{font-size:clamp(1.35rem,2vw,1.8rem);font-weight:850;line-height:1.2;letter-spacing:-.035em}
    .page-heading p{font-size:.88rem;color:#64748b;margin-top:6px;line-height:1.5}
    .dashboard-quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
    .dashboard-quick-actions button{min-width:0;min-height:126px}
    .dashboard-quick-actions button:last-child:nth-child(odd){grid-column:1/-1;min-height:96px}
    @media(min-width:640px){.dashboard-quick-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard-quick-actions button:last-child:nth-child(odd){grid-column:auto;min-height:126px}}
    .toast{animation:slideUp .2s ease-out;max-width:min(92vw,420px)}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .skeleton{background:linear-gradient(90deg,#eee 25%,#f7f7f7 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-200% 0}}
    @media(max-width:767px){.app-topbar{height:64px}.app-topbar .topbar-store{max-width:70px}.app-topbar .pill{font-size:.65rem;padding:.28rem .5rem}.app-topbar .btn{width:42px;height:42px;padding:0}.page-heading{align-items:flex-start;flex-direction:column}.page-heading .page-actions{width:100%}.page-heading .page-actions .btn{flex:1}.bento{border-radius:17px}.kpi{padding:13px;border-radius:16px}.kpi .mono{font-size:1.15rem}.product-admin-foot .btn{width:40px;height:40px;padding:0}}
    @supports(height:100svh){body,#app,.app-shell{min-height:100svh}}
  </style>
  <script>window.POS_CONFIG = { API_URL: '' };</script>
</head>
<body>
  <div id="app" class="min-h-screen"><div class="min-h-screen grid place-items-center p-6"><div class="text-center"><div class="mx-auto h-12 w-12 rounded-2xl bg-mint border-2 border-ink shadow-hard grid place-items-center text-xl">▦</div><p class="mt-4 font-extrabold">POS SuperApp</p><p class="text-sm text-slate-500 mt-1">Menyiapkan aplikasi…</p></div></div></div>
  <div id="toast-root" class="fixed z-[110] right-4 space-y-2 pointer-events-none" style="bottom:calc(112px + env(safe-area-inset-bottom, 0px))"></div>
  <script src="/app.js" defer></script>
</body>
</html>
